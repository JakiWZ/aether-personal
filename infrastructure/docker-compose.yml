# Local development stack.
# Usage (from the repository root):
#   docker compose -f infrastructure/docker-compose.yml up -d                     # database only
#   docker compose -f infrastructure/docker-compose.yml --profile tools run --rm migrate
# To override the defaults: cp .env.example .env, edit it, and add `--env-file .env`.
#
# Credentials below are local-only defaults, not secrets. Real environments
# inject their own values through environment variables.
name: aether

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AETHER_DB_NAME:-aether}
      POSTGRES_USER: ${AETHER_DB_USER:-aether}
      POSTGRES_PASSWORD: ${AETHER_DB_PASSWORD:-aether}
    ports:
      - "${AETHER_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot container that applies the Flyway migrations to the local database.
  # The backend also runs them on startup; this is handy for DB-only work.
  migrate:
    image: flyway/flyway:13.10.0
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../backend/src/main/resources/db/migration:/flyway/sql:ro
    command: >
      -url=jdbc:postgresql://postgres:5432/${AETHER_DB_NAME:-aether}
      -user=${AETHER_DB_USER:-aether}
      -password=${AETHER_DB_PASSWORD:-aether}
      -schemas=aether
      migrate

volumes:
  postgres-data:
