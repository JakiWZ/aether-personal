<a class="skip-link" href="#main-content">Skip to main content</a>
<header>
  <a class="brand" routerLink="/dashboard">AETHER</a>
  @let session = auth.session();
  @if (session.authenticated) {
    <nav aria-label="Main navigation">
      <ul>
        <li>
          <a routerLink="/dashboard" routerLinkActive="active" ariaCurrentWhenActive="page"
            >Mission Control</a
          >
        </li>
        @for (d of domains; track d.path) {
          <li>
            <a
              [routerLink]="['/', d.path]"
              routerLinkActive="active"
              ariaCurrentWhenActive="page"
              >{{ d.label }}</a
            >
          </li>
        }
      </ul>
    </nav>
    <div class="user">
      <span
        >Signed in as <strong>{{ session.displayName }}</strong></span
      >
      <button type="button" class="link" (click)="logout()">Sign out</button>
    </div>
  }
  <app-backend-status />
</header>
<main id="main-content" tabindex="-1">
  <router-outlet />
</main>
