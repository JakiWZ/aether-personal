<h1>New mission</h1>
<p class="intro">
  The mission is saved as a draft. Fields marked * are required; times are in UTC.
</p>

<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  @if (formError(); as e) {
    <div class="message error" role="alert">
      <p>The mission could not be drafted. {{ e.message }}</p>
    </div>
  }

  <ng-template #fieldError let-name>
    @if (showErrors(name)) {
      <p class="field-error" [id]="name + '-error'">{{ errorMessage(name) }}</p>
    }
  </ng-template>

  <div class="field">
    <label for="code">Mission code *</label>
    <input
      id="code"
      formControlName="code"
      autocomplete="off"
      [attr.aria-invalid]="showErrors('code')"
      [attr.aria-describedby]="showErrors('code') ? 'code-error' : null"
    />
    <ng-container *ngTemplateOutlet="fieldError; context: { $implicit: 'code' }" />
  </div>

  <div class="field">
    <label for="title">Title *</label>
    <input
      id="title"
      formControlName="title"
      [attr.aria-invalid]="showErrors('title')"
      [attr.aria-describedby]="showErrors('title') ? 'title-error' : null"
    />
    <ng-container *ngTemplateOutlet="fieldError; context: { $implicit: 'title' }" />
  </div>

  <div class="field">
    <label for="objective">Objective *</label>
    <textarea
      id="objective"
      formControlName="objective"
      rows="3"
      [attr.aria-invalid]="showErrors('objective')"
      [attr.aria-describedby]="showErrors('objective') ? 'objective-error' : null"
    ></textarea>
    <ng-container *ngTemplateOutlet="fieldError; context: { $implicit: 'objective' }" />
  </div>

  <div class="field">
    <label for="description">Notes</label>
    <textarea
      id="description"
      formControlName="description"
      rows="3"
      [attr.aria-invalid]="showErrors('description')"
      [attr.aria-describedby]="showErrors('description') ? 'description-error' : null"
    ></textarea>
    <ng-container *ngTemplateOutlet="fieldError; context: { $implicit: 'description' }" />
  </div>

  <div class="field">
    <label for="type">Type *</label>
    <select
      id="type"
      formControlName="type"
      [attr.aria-invalid]="showErrors('type')"
      [attr.aria-describedby]="showErrors('type') ? 'type-error' : null"
    >
      <option value="" disabled>Choose a type</option>
      @for (t of types; track t) {
        <option [value]="t">{{ typeLabels[t] }}</option>
      }
    </select>
    <ng-container *ngTemplateOutlet="fieldError; context: { $implicit: 'type' }" />
  </div>

  <div class="field">
    <label for="originColonyCode">Departure base *</label>
    <select
      id="originColonyCode"
      formControlName="originColonyCode"
      [attr.aria-invalid]="showErrors('originColonyCode')"
      [attr.aria-describedby]="showErrors('originColonyCode') ? 'originColonyCode-error' : null"
    >
      <option value="" disabled>Choose an active base</option>
      @for (c of colonies(); track c.code) {
        <option [value]="c.code">{{ c.code }} · {{ c.name }}</option>
      }
    </select>
    <ng-container *ngTemplateOutlet="fieldError; context: { $implicit: 'originColonyCode' }" />
  </div>

  <div class="field">
    <label for="plannedStartAt">Planned start (UTC) *</label>
    <input
      id="plannedStartAt"
      type="datetime-local"
      formControlName="plannedStartAt"
      [attr.aria-invalid]="showErrors('plannedStartAt')"
      [attr.aria-describedby]="showErrors('plannedStartAt') ? 'plannedStartAt-error' : null"
    />
    <ng-container *ngTemplateOutlet="fieldError; context: { $implicit: 'plannedStartAt' }" />
  </div>

  <div class="field">
    <label for="plannedEndAt">Planned end (UTC) *</label>
    <input
      id="plannedEndAt"
      type="datetime-local"
      formControlName="plannedEndAt"
      [attr.aria-invalid]="showErrors('plannedEndAt')"
      [attr.aria-describedby]="showErrors('plannedEndAt') ? 'plannedEndAt-error' : null"
    />
    <ng-container *ngTemplateOutlet="fieldError; context: { $implicit: 'plannedEndAt' }" />
  </div>

  <div class="field">
    <label for="priority">Priority *</label>
    <select id="priority" formControlName="priority">
      @for (p of priorities; track p) {
        <option [value]="p">{{ priorityLabels[p] }}</option>
      }
    </select>
  </div>

  <div class="field">
    <label for="safetyLevel">Risk level *</label>
    <select id="safetyLevel" formControlName="safetyLevel">
      @for (s of safetyLevels; track s) {
        <option [value]="s">{{ safetyLabels[s] }}</option>
      }
    </select>
  </div>

  <div class="actions">
    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Saving…' : 'Save draft' }}
    </button>
    <a routerLink="..">Cancel</a>
  </div>
</form>
