# Configuration is externalised through environment variables (NFR-008, INT-605).
# Defaults target the local Docker Compose database and are not secrets.
spring:
  application:
    name: aether-backend
  profiles:
    group:
      dev: demo               # `dev` also loads the demo dataset (application-demo.yml)
  datasource:
    url: jdbc:postgresql://${AETHER_DB_HOST:localhost}:${AETHER_DB_PORT:5432}/${AETHER_DB_NAME:aether}
    username: ${AETHER_DB_USER:aether}
    password: ${AETHER_DB_PASSWORD:aether}
  flyway:
    schemas: aether
    default-schema: aether
    # The demo dataset is a repeatable migration seen only with the `demo` profile (ADR-0007).
    # Tolerate it in the history when the backend runs without that profile on a demo database.
    ignore-migration-patterns: "*:future,repeatable:missing"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # the schema is owned by Flyway (ADR-0004)
    properties:
      hibernate:
        default_schema: aether
        jdbc:
          time_zone: UTC      # BR-011: persist instants in UTC
  jackson:
    time-zone: UTC
    # Strict request parsing (OWASP API3/API4:2023): reject what the API does not declare rather than
    # guessing. Unknown or duplicate properties and coerced scalars ("code": 123) are 400 MALFORMED_REQUEST.
    deserialization:
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
    mapper:
      allow-coercion-of-scalars: false
    read:
      strict-duplicate-detection: true
    factory:
      constraints:
        read:
          max-document-length: 65536   # same as aether.http.max-request-body, for bodies sent without a length

aether:
  http:
    max-request-body: 64KB             # larger declared bodies get 413 PAYLOAD_TOO_LARGE before being read

server:
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
