name: AETHER CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Database migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aether
          POSTGRES_USER: aether
          POSTGRES_PASSWORD: aether   # throwaway CI-only credential
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aether -d aether"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FLYWAY_IMAGE: flyway/flyway:12.4.0
      FLYWAY_ARGS: -url=jdbc:postgresql://localhost:5432/aether -user=aether -password=aether -schemas=aether
    steps:
      - uses: actions/checkout@v7

      - name: Apply migrations on an empty database
        run: |
          docker run --rm --network host \
            -v "$PWD/backend/src/main/resources/db/migration:/flyway/sql:ro" \
            "$FLYWAY_IMAGE" $FLYWAY_ARGS migrate

      - name: Validate checksums and re-run (must be a no-op)
        run: |
          for goal in validate migrate; do
            docker run --rm --network host \
              -v "$PWD/backend/src/main/resources/db/migration:/flyway/sql:ro" \
              "$FLYWAY_IMAGE" $FLYWAY_ARGS "$goal"
          done

      - name: Smoke-check schema and reference data
        env:
          PGPASSWORD: aether
        run: |
          psql -h localhost -U aether -d aether -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF (SELECT count(*) FROM information_schema.tables
                WHERE table_schema = 'aether' AND table_type = 'BASE TABLE') < 60 THEN
              RAISE EXCEPTION 'unexpected number of tables';
            END IF;
            IF (SELECT count(*) FROM aether.app_role) <> 8 THEN
              RAISE EXCEPTION 'reference roles missing';
            END IF;
            IF EXISTS (SELECT 1 FROM aether.colony) THEN
              RAISE EXCEPTION 'demo data loaded without the demo location';
            END IF;
          END $$;
          SQL

      # Demo dataset (TASK-004): applied on top of the schema twice, the second run must be a no-op.
      - name: Load the demo dataset
        run: |
          for run in 1 2; do
            docker run --rm --network host \
              -v "$PWD/backend/src/main/resources/db/migration:/flyway/sql:ro" \
              -v "$PWD/backend/src/main/resources/db/demo:/flyway/demo:ro" \
              "$FLYWAY_IMAGE" $FLYWAY_ARGS -locations=filesystem:/flyway/sql,filesystem:/flyway/demo migrate
          done

      - name: Smoke-check the demo dataset
        env:
          PGPASSWORD: aether
        run: |
          psql -h localhost -U aether -d aether -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF (SELECT count(*) FROM aether.colony) < 3 THEN
              RAISE EXCEPTION 'demo: fewer than 3 bases';
            END IF;
            IF (SELECT count(*) FROM aether.crew_member) < 15 THEN
              RAISE EXCEPTION 'demo: fewer than 15 crew members';
            END IF;
            IF (SELECT count(DISTINCT status) FROM aether.mission) < 8 THEN
              RAISE EXCEPTION 'demo: missions do not cover every lifecycle state';
            END IF;
          END $$;
          SQL

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Detect backend
        id: backend
        shell: bash
        run: |
          if [ -f backend/pom.xml ] || [ -f backend/mvnw ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5
        if: steps.backend.outputs.exists == 'true'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # `verify` runs unit tests (surefire) and Testcontainers integration tests (failsafe).
      - name: Build/test backend
        if: steps.backend.outputs.exists == 'true'
        shell: bash
        working-directory: backend
        run: |
          if [ -f mvnw ]; then
            chmod +x mvnw
            ./mvnw -B -ntp verify
          else
            mvn -B -ntp verify
          fi

      - name: Upload test reports
        if: failure() && steps.backend.outputs.exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

      - name: Backend not initialized
        if: steps.backend.outputs.exists != 'true'
        run: echo "Backend non ancora inizializzato - nessun controllo da eseguire."

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Detect frontend
        id: frontend
        shell: bash
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.frontend.outputs.exists == 'true'
        with:
          node-version: "22"

      - name: Install and build frontend
        if: steps.frontend.outputs.exists == 'true'
        shell: bash
        run: |
          cd frontend
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm run build --if-present

      - name: Frontend not initialized
        if: steps.frontend.outputs.exists != 'true'
        run: echo "Frontend non ancora inizializzato - nessun controllo da eseguire."
